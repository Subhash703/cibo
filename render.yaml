# Render Blueprint — declares the web service + free Postgres for Cibo.
# When you create a new Blueprint deploy from the Subhash703/cibo repo,
# Render reads this file and provisions everything in one go.
#
# Heads up: Render's free Postgres expires after 90 days, then the DB is
# deleted. Calendar a reminder for day 75 to either migrate the data to
# Neon / paid Render, or accept the wipe. Free web service is always free.

databases:
  - name: cibo-db
    plan: free
    # NOTE: was `singapore` but Render's Singapore IPs trigger Gemini's
    # "User location is not supported" geo check. Oregon works reliably.
    # Render free Postgres requires the web service in the same region,
    # so the service below also lives in oregon.
    region: oregon
    postgresMajorVersion: "16"
    # No `ipAllowList` block ⇒ defaults to allowing all Render services in
    # the same region to connect (which is what we want).

services:
  - type: web
    name: cibo-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /healthz
    # Cold-starts on free tier kick in after 15min idle. Pinging /healthz
    # every 10min from an external cron (cron-job.org / UptimeRobot) keeps
    # the dyno warm without paying.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cibo-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false             # mark as secret; you paste it in dashboard
      - key: JWT_SECRET
        generateValue: true     # Render rolls a fresh random value on first deploy
      - key: PYTHONUNBUFFERED
        value: "1"
