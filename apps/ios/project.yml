name: Cibo
options:
  bundleIdPrefix: in.foodlens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # ──────────────── Main app ────────────────
  Cibo:
    type: application
    platform: iOS
    sources:
      - path: Cibo
        excludes:
          - Info.plist
    info:
      path: Cibo/Info.plist
      properties:
        CFBundleDisplayName: Cibo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: []
        NSCameraUsageDescription: Cibo uses the camera to analyse meals on your plate.
        NSPhotoLibraryUsageDescription: Cibo reads photos you pick so it can analyse meals or shared cart screenshots.
        UIAppFonts:
          - Fraunces-VariableFont.ttf
          - PlusJakartaSans-VariableFont.ttf
          - PlusJakartaSans-Italic-VariableFont.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foodlens.cibo
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CIBO_API_BASE_URL: https://cibo-api-op1m.onrender.com
    dependencies:
      - target: ShareExtension
        embed: true
      - target: CiboWidgets
        embed: true

  # ──────────────── Share Extension ────────────────
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
      # Shared compilation units. Cheaper than a framework.
      - path: Cibo/Theme.swift
      - path: Cibo/Components
      - path: Cibo/Network
      - path: Cibo/Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Cibo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: XPC!
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foodlens.cibo.share
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CIBO_API_BASE_URL: https://cibo-api-op1m.onrender.com
        SKIP_INSTALL: YES

  # ──────────────── Widget / Live Activity ────────────────
  CiboWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CiboWidgets
        excludes:
          - Info.plist
      - path: Cibo/Theme.swift
      - path: Cibo/Shared
    info:
      path: CiboWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cibo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foodlens.cibo.widgets
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES

# Explicit schemes — guarantees the main "Cibo" scheme exists in the
# scheme picker (the auto-generated one was getting eaten on regenerate).
schemes:
  Cibo:
    build:
      targets:
        Cibo: all
        ShareExtension: [run, profile, archive]
        CiboWidgets: [run, profile, archive]
    run:
      config: Debug
      executable: Cibo
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ShareExtension:
    build:
      targets:
        ShareExtension: all
        Cibo: [run]   # host app must build to run an extension
    run:
      config: Debug
  CiboWidgets:
    build:
      targets:
        CiboWidgets: all
        Cibo: [run]
    run:
      config: Debug
